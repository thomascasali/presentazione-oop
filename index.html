<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmazione ad Oggetti - OOP con C# e UML</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }

        /* Loading animation */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Presentation Styles */
        .presentation-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(to bottom right, #111827, #1e3a8a, #111827);
            color: white;
        }

        .presentation-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
        }

        .icon-button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }

        .icon-button:hover:not(:disabled) {
            background: rgba(59, 130, 246, 0.2);
        }

        .icon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            flex: 1;
            height: 8px;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            transition: all 0.2s ease;
        }

        .progress-container:hover {
            height: 12px;
            background: rgba(55, 65, 81, 0.7);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #22d3ee);
            transition: width 0.3s ease;
        }

        .slide-counter {
            font-size: 0.875rem;
            color: #d1d5db;
        }

        .slide-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .slide-inner {
            width: 100%;
            max-width: 1200px;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            margin-top: 1rem;
        }

        .slide-header {
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 1rem;
        }

        .slide-body {
            padding-top: 1.5rem;
        }

        .presentation-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(59, 130, 246, 0.3);
        }

        .nav-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .nav-button:hover:not(:disabled) {
            background: #2563eb;
        }

        .nav-button:disabled {
            background: #374151;
            cursor: not-allowed;
        }

        .section-info {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        /* Sidebar Menu */
        .sidebar-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(59, 130, 246, 0.3);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .menu-header h2 {
            font-size: 1.5rem;
            margin: 0;
        }

        .menu-navigation {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .menu-section {
            margin-bottom: 0.5rem;
        }

        .menu-item {
            width: 100%;
            text-align: left;
            padding: 0.75rem;
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: white;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .menu-item:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .menu-item.active {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }

        .menu-item.quiz-item {
            border-color: rgba(168, 85, 247, 0.4);
        }

        .menu-item.quiz-item:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.6);
        }

        /* Menu Overlay */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* Sub menu items */
        .menu-sub-items {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-left: 1rem;
            margin-top: 0.5rem;
        }

        .menu-sub-item {
            padding: 0.5rem 0.75rem;
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.1);
            color: #9ca3af;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: left;
            transition: all 0.2s;
        }

        .menu-sub-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: white;
        }

        .menu-sub-item.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: white;
        }

        /* Code Block with Copy Button */
        .code-block-wrapper {
            position: relative;
        }

        .copy-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.25rem 0.5rem;
            background: rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #93c5fd;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .copy-button:hover {
            background: rgba(59, 130, 246, 0.5);
            color: white;
        }

        .copy-button.copied {
            background: rgba(34, 197, 94, 0.3);
            border-color: rgba(34, 197, 94, 0.5);
            color: #86efac;
        }

        /* Keyboard Shortcuts Help Panel */
        .shortcuts-panel {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 0.75rem;
            padding: 1rem;
            z-index: 100;
            max-width: 300px;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shortcuts-panel h3 {
            font-size: 0.875rem;
            font-weight: bold;
            color: #93c5fd;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.375rem 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }

        .shortcut-item:last-child {
            border-bottom: none;
        }

        .shortcut-key {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: #93c5fd;
        }

        .shortcut-desc {
            color: #9ca3af;
            font-size: 0.75rem;
        }

        /* Progress Tracking Indicator */
        .progress-tracker {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 9999px;
            font-size: 0.75rem;
            color: #86efac;
        }

        .progress-tracker-icon {
            width: 1rem;
            height: 1rem;
        }

        /* Global Score Badge */
        .score-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3));
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 9999px;
            font-size: 0.875rem;
            color: #e9d5ff;
            font-weight: bold;
        }

        /* Flashcard Styles */
        .flashcard {
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 200px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }

        .flashcard-front {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: 2px solid #60a5fa;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #065f46, #059669);
            border: 2px solid #34d399;
            transform: rotateY(180deg);
        }

        /* Responsive Code Blocks */
        @media (max-width: 768px) {
            .slide-inner {
                padding: 1rem;
            }

            pre {
                font-size: 0.65rem !important;
                overflow-x: auto;
            }

            .grid-cols-2 {
                grid-template-columns: 1fr !important;
            }

            .grid-cols-3 {
                grid-template-columns: 1fr !important;
            }

            .grid-cols-4 {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .shortcuts-panel {
                display: none;
            }
        }

        /* Improved Code Scrolling */
        pre {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }

        .code-scroll-hint {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2rem;
            background: linear-gradient(transparent, rgba(17, 24, 39, 0.9));
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0.25rem;
            font-size: 0.625rem;
            color: #6b7280;
        }

        /* Print Styles */
        @media print {
            body {
                overflow: visible !important;
                background: white !important;
            }

            .presentation-container {
                background: white !important;
                height: auto !important;
            }

            .presentation-header,
            .presentation-footer,
            .sidebar-menu,
            .menu-overlay,
            .shortcuts-panel,
            .icon-button,
            .nav-button,
            .copy-button {
                display: none !important;
            }

            .slide-content {
                padding: 0 !important;
                overflow: visible !important;
                page-break-after: always;
            }

            .slide-inner {
                background: white !important;
                box-shadow: none !important;
                border: 1px solid #e5e7eb;
                margin: 0 !important;
                max-width: 100% !important;
            }

            pre {
                max-height: none !important;
                overflow: visible !important;
                background: #f3f4f6 !important;
                color: #1f2937 !important;
                border: 1px solid #e5e7eb;
            }

            .text-white {
                color: #1f2937 !important;
            }

            .text-gray-300,
            .text-gray-400 {
                color: #4b5563 !important;
            }

            .text-blue-300,
            .text-blue-400,
            .text-cyan-300,
            .text-cyan-400 {
                color: #1d4ed8 !important;
            }

            a {
                text-decoration: underline;
            }

            /* Page numbering */
            @page {
                margin: 1.5cm;
                @bottom-center {
                    content: counter(page) " / " counter(pages);
                }
            }
        }

        /* Quiz Feedback Styles */
        .quiz-feedback {
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1rem;
            animation: fadeInUp 0.3s ease;
        }

        .quiz-feedback.correct {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .quiz-feedback.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .quiz-feedback h4 {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .quiz-feedback.correct h4 {
            color: #86efac;
        }

        .quiz-feedback.incorrect h4 {
            color: #fca5a5;
        }

        .quiz-feedback p {
            color: #d1d5db;
            font-size: 0.875rem;
        }

        /* Help Button Toggle */
        .help-toggle {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            background: rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #93c5fd;
            font-size: 1.25rem;
            transition: all 0.2s;
            z-index: 50;
        }

        .help-toggle:hover {
            background: rgba(59, 130, 246, 0.5);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(to bottom right, #111827, #1e3a8a, #111827);">
            <div class="loader"></div>
        </div>
    </div>

    <!-- Load the presentation modules -->
    <!-- Shared Components (must load first) -->
    <script type="text/babel" src="utils/components.jsx?v=5"></script>

    <!-- Dashboard -->
    <script type="text/babel" src="slides/00-dashboard.jsx?v=5"></script>

    <!-- Slide Modules -->
    <script type="text/babel" src="slides/01-fondamenti.jsx?v=5"></script>
    <script type="text/babel" src="slides/02-costruttori-properties.jsx?v=5"></script>
    <script type="text/babel" src="slides/03-metodi-incapsulamento.jsx?v=5"></script>
    <script type="text/babel" src="slides/04-ereditarieta-polimorfismo.jsx?v=5"></script>
    <script type="text/babel" src="slides/05-associazioni-riepilogo.jsx?v=5"></script>
    <script type="text/babel" src="slides/06-esercizi.jsx?v=5"></script>

    <!-- Quiz Modules -->
    <script type="text/babel" src="quizzes/quiz-01-fondamenti.jsx?v=5"></script>
    <script type="text/babel" src="quizzes/quiz-02-costruttori.jsx?v=5"></script>
    <script type="text/babel" src="quizzes/quiz-03-metodi.jsx?v=5"></script>
    <script type="text/babel" src="quizzes/quiz-04-ereditarieta.jsx?v=5"></script>
    <script type="text/babel" src="quizzes/quiz-05-associazioni.jsx?v=5"></script>

    <!-- Main Application -->
    <script type="text/babel" src="main.jsx?v=5"></script>

    <script type="text/babel">
        // Render the main component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(OOPPresentation));
    </script>
</body>
</html>
